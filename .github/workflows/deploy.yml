# Publishes the production image, only after CI succeeds on a push to main.
#
#   ghcr.io/<owner>/<repo>:<full commit sha>   immutable release identity
#   ghcr.io/<owner>/<repo>:main                moves to the newest release
#
# Nothing here reaches the P410. The P410's deploy script pulls :main by digest on
# its own schedule, so GitHub holds no credential for the server.

name: Publish image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          build-args: APP_VERSION=${{ env.SHA }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.SHA }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}

      - name: Release record
        run: |
          {
            echo "### Published"
            echo "- image: \`${{ steps.image.outputs.name }}:${SHA}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- \`:main\` now points at this digest"
          } >> "$GITHUB_STEP_SUMMARY"
